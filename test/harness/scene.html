<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weave scene probe</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        padding: 16px;
        background: #ffffff;
        color: #222222;
        font:
          14px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }

      .probe {
        display: grid;
        gap: 12px;
        max-width: 640px;
      }

      .stage {
        width: 100%;
        height: 320px;
        background: #eeeeee;
        transform: translateZ(0);
      }

      .stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/test/harness/scene.tsx"></script>
  </body>
</html>
